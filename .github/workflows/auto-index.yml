name: 📰 Auto-update index.html

on:
  push:
    branches: [ main ]
    paths:
      - '*.html'
      - '!index.html'   # index.html 변경 자체는 트리거 안 함 (무한루프 방지)

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run update_index.py
        run: python3 update_index.py

      - name: Commit if index.html changed
        run: |
          git config user.email "namho1123@gmail.com"
          git config user.name "ephraim88106"
          if git diff --quiet index.html; then
            echo "index.html 변경 없음 — 이미 등록된 아티클"
          else
            git add index.html
            git commit -m "auto: index.html 자동 업데이트 [skip ci]"
            git push
            echo "✅ index.html 푸시 완료"
          fi
